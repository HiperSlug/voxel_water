[package]
name = "voxel_water"
version = "0.1.0"
edition = "2024"

[lib]
name = "voxel_water_lib"
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"

[dependencies]
bevy = { version = "0.18.0", features = ["free_camera"] }
bit-iter = "1.3.1"
bytemuck = "1.24.0"
dashmap = { version = "6.1.0", features = ["inline", "rayon"] }
enum-map = "2.7.3"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
ndshape = "0.3.0"
nonmax = "0.5.5"
offset-allocator = "0.2.0"
rand = "0.9.2"
